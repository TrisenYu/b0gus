version: "2"

linters:
  settings:
    staticcheck:
      checks:
        - all
        - '-ST1000'
        - '-ST1003'
        - '-ST1012'
        - '-ST1016'
        - '-ST1020'
        - '-ST1021'
        - '-ST1022'
        - '-SA1012'

run:
  timeout: 5m
  go: "1.26"
  concurrency: 2
  tests: true
  skip-dirs:
    - _examples
    - docs
    - _future-feats
