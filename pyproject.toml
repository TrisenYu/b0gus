[project]
authors = [
	{ name="", email="jajune257@gmail.com" },
	{ name="", email="kisfg@hotmail.com" }
]
name = "b0gus-pyenv"
version = "0.1.2"
description = ""
requires-python = ">=3.13"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "certifi==2026.2.25",
    "distro==1.9.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "iniconfig==2.3.0",
    "jiter==0.14.0",
    "loguru==0.7.3",
    "openai==2.38.0",
    "packaging==26.2",
    "pluggy==1.6.0",
    "pydantic==2.13.3",
    "pydantic-core==2.46.3",
    "pygments==2.20.0",
    "pytest==9.0.3",
    "python-dotenv==1.2.2",
    "ruff==0.15.12",
    "sniffio==1.3.1",
    "tqdm==4.67.3",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
]

[tool.ruff]
indent-width = 4
line-length = 110

[[tool.uv.index]]
# set to normal url or other mirror link by yourself if you have such a demand
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff.lint]
# reference: https://docs.astral.sh/ruff/linter/#fixes
select = [
	"F",
	"E",
	"N",
	"I",
	"W",
	"PL",
	"PERF",
]
ignore=["E731"]

[tool.ruff.lint.pylint]
max-nested-blocks = 4

# setup for pytest
[tool.pytest.ini_options]
pythonpath = "."
