#     \  \ `_.   \_ __\ /__ _/   .-` /  /
# =====`-.____`.___ \_____/___.-`___.-'=====
# Or default one to make it more natural...


[server_config.smtp]
    listen_addr = "127.0.0.1"
    listen_port = 2555
    # (cert, key) should be signed by real CA
    # or keep both blank
    tls_cert_path = ""
    tls_key_path = ""
    local_save_dir = ""
    max_client_num = 32

[server_config.dns]
    listen_addr = "127.0.0.1"
    listen_port = 2053
    max_client_num = 32

[server_config.fake_db]
    # database as honeypot
    # TODO
    type = ""

[server_config.http]
    listen_addr = "127.0.0.1"
    listen_port = 8808
    max_client_num = 32
    # left empty => only enable http.
    tls_cert_path = ""
    # or, let (key, cert) exist and is signed off by real CA
    tls_key_path = ""

# Can't update configuration of database during executing time
# Yet to have a checking/filtering mechanism to determine
# whether database_addr:database_port is requried
[server_config.rec_db_config]

    # PostgreSQL, SQLite, MongoDB
    type = "PostgreSQL" # mongodb, MONGODB, MongoDB 
    name = "postgres"

    # Some database can be deemed as a distributed cluster,
    # so an IP address is require.
    addr = "localhost"
    port = 5432         # the port for mongoDB is 27017

    # Some database requires an admin to operate.
    admin_name = "postgres"
    admin_password = "YouPassw0rdShouldBeStrongAndInvisible2Others"

    # This redundant field is used for different SQLs like SQLite
    # Unlike PostgreSQL, SQLite stores data in a `db` file whose path is 
    # explictly given. And default directory is set to `assets`, where stores the database
    # file that **have to be created** manually or by automatic scripts
    # Lastly, the corresponding dataname should fill with `sqlite`, `SQLITE`, or `SQLite`
    path = "nasty-ssh-client.db"
