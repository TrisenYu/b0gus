[server_config]
# will store pem in the same `configs` directory
pem_name = "ssh-host.pem"
listen_addr = "localhost"
# it might be identical to run this program in port 22 as a bogus ssh server
# but for non-root user, binding to port < 1024 is not allowed
# so we will use docker in the future
listen_port = 2333
service_name = "ssh"
max_client_num = 32
client_conn_timeout = 180  # in seconds

# only store `ip, username, password, access time and public key` info
permit_login = true
empty_shell = true
# just repeat what user inputs back to the terminal
# TODO: add more response types later
response_type = "repeater"

# yet to have a checking/filtering mechanism to determine 
# whether database_addr:database_port is requried
database_type = "PostgreSQL"
database_name = "postgres"
database_addr = "localhost"
database_port = 5432
database_admin_name = "postgres"
database_admin_pass = "YouPassw0rdShouldBeStrongAndInvisible2Others"


# this domain is used for different sql like SQLite.
# Unlike PostgreSQL, SQLite stores data in a `db` file whose path is 
# explictly given
database_path = "/home/bot/Projects/SQLite/nasty-ssh-client.db"

