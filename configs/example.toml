# DO NOT DELETE THIS FILE. THIS FILE IS ALSO USE AS ONE OF THE CONTENT
# SOURCE READING BY TESTCASES, The configuration file copied by container.
# This is an example configuration. You should create your own `config.toml` in the
# same directory so that b0gus can run as what you expect it to obey.
############################### NOTICE ###############################
# Will store pem in the same `configs` directory
language = "en"

# first will check the field and then enable with the high priority to apply
# for the services, no matter it is local or remote service
# Not use at present
message_queue_addr = "192.168.1.5:65431"

# for rpc, services-discovery simplify the difficulty of Dev-ops.
# prvodied a client that wants to invoke services, or a service waiting for being invoked.
# Not use at present
register_center_addr = "192.168.2.33:54320"

# It might be identical to run this program in port 22 as a b0gus ssh server
# but for non-root user, binding to port < 1024 is not allowed
# So we will use docker in the future to achieve such goal
[ssh]
	# deploy locally or invoke by RPC, thereby a field for checking whether the service requires RPC
	invoke_by_rpc = true
	# number of replica for the same service
	rpc_replica = 2

    listen_addr = "0.0.0.0"
    listen_port = 2222
	# tls_key_path defines the filepath of the pem file used by the fake SSH service
	tls_key_path = "b0gus-host.pem"
	# also work. But only as a backword compatibility
    pem_name = "b0gus-host.pem"
    pem_type = "ecdh"
    pem_len = 512
    ## Strategy on ssh server configuration
    max_client_num = 32
    client_conn_timeout = 180 # time-unit is second
    permit_login = true

    # Just repeat what user inputs back to the terminal
    # Optional-Mode: llm, repeater or empty
    #   `repeater` means repeating the command typed by remote client
    #   `empty` means if you try typing, then the expected behavior is just entering
    #   `llm` means the command will handled by llm.
    # another new line for every command.
    response_type = "llm"
    # when selecting `llm` for [response_type], then the field is required.
    llm_conf_path = "/usr/share/b0gus/etc/llm-conf.toml"

    # banner for displaying after successfully logining into system
	# default one typically will make it more natural...
	# while there are custom banners in """assets/ref-login-banners"""
    login_banner = ''''''

	## it is not necessary to use local database when RPC is implemented for recording data.
	## Concurrent writes from multiple services pose database concurrency risks.
	## Hardcoded database admin credentials in configs may cause information leakage.
	## So Adopt a unified message queue to access databases uniformly.
	db_type = "PostgreSQL" # PostgreSQL, SQLite, MongoDB
	db_name = "postgres"
	# Some database can be deemed as a distributed cluster,
	# so an IP address is require.
	db_addr = "localhost"
	db_port = 5432  # the port for mongoDB is 27017
	db_timeout = 10 # second
	# Some database requires an admin to operate.
	db_admin_name = "postgres"
	db_admin_password = "YouP@ssw0rdShouldBeStrongAndInvisibleToOthers"

	# This redundant field is used for different SQLs like SQLite
	# Unlike PostgreSQL, SQLite stores data in a `db` file whose path is
	# explictly given. And default directory is set to `assets`, where stores the database
	# file that **have to be created** manually or by automatic scripts
	# Lastly, the corresponding dataname should fill with `sqlite`, `SQLITE`, or `SQLite`
	db_path = "nasty-client.db"

