############################### NOTICE ###############################
# DO NOT DELETE THIS FILE. THIS FILE IS ALSO USE AS ONE OF THE CONTENT 
# SOURCE READING BY TESTCASES, The configuration file copied by container.
# This is an example configuration. You should create your own `config.toml` in the
# same directory so that b0gus-arm64 can run as what you expect it to obey.
############################### NOTICE ###############################

[server_config]
# Will store pem in the same `configs` directory
language = "en"

# It might be identical to run this program in port 22 as a b0gus-arm64 ssh server
# but for non-root user, binding to port < 1024 is not allowed
# So we will use docker in the future to achieve such goal
[server_config.ssh]
    listen_addr = "localhost"
    listen_port = 2333
    pem_name = "b0gus-host.pem"
    pem_type = "ecdh"
    pem_len = 512
    ## Strategy on ssh server configuration
    max_client_num = 32
    client_conn_timeout = 180 # time-unit is second
    # Only store `ip, username, password, access time and public key` information
    # TODO: set them as strategy
    permit_login = true

    # Just repeat what user inputs back to the terminal
    # Optional-Mode: llm, repeater or empty
    #   `repeater` means repeating the command typed by remote client
    #   `empty` means if you try typing, then the expected behavior is just entering
    #   `llm` means the command will handled by llm.
    # another new line for every command.
    response_type = "repeater"
    # when selecting `llm` for [response_type], then these fields are required.
    llm_type = ""

    # banner for displaying after successfully logining into system
    login_banner = ''''''
# _______________#########_______________________
#______________############_____________________
#______________#############____________________
#_____________##__###########___________________
#____________###__######_#####__________________
#____________###_#######___####_________________
