[meta_conf]
    [meta_conf.AssetsDir]
    other = "Setzen Sie das Verzeichnis für statische Ressourcen."
    [meta_conf.ConfPath]
    other = "Pfad der lokalen Konfigurationsdatei."
    [meta_conf.PermitConfAlterInRuntime]
    other = "Einstellung für die zulässige Konfigurationsänderung während der Laufzeit."
    [meta_conf.PermitSelfAlterInRuntime]
    other = "Einstellung für die zulässige Selbständerung der Konfiguration während der Laufzeit."
