[meta_conf]
    [meta_conf.AssetsDir]
    other = "Verzeichnis für statische Ressourcen festlegen."
    [meta_conf.ConfPath]
    other = "Pfad zur lokalen Konfigurationsdatei."
    [meta_conf.PermitConfAlterInRuntime]
    other = "Einstellung, die Änderungen der Konfiguration während der Laufzeit erlaubt."
    [meta_conf.PermitSelfAlterInRuntime]
    other = "Einstellung, die Selbständerungen der Konfiguration während der Laufzeit erlaubt."
    [meta_conf.PermitShellAlterInRuntime]
    other = "Berechtigungseinstellung, die Änderungen der Konfiguration durch Eingabe von Befehlen in die Shell während der Laufzeit erlaubt."
    [meta_conf.PermitRemotePullInRuntime]
    other = "Berechtigungseinstellung, die Änderungen der Konfiguration durch Abrufen von einer entfernten Quelle während der Laufzeit erlaubt."

[main]
    [main.DatabaseConnectionError]
    other = "Verbindung zur Datenbank {{.DatabaseStr}} konnte nicht hergestellt werden. Fehlerüberprüfung: `{{.ErrInfo}}`."
    [main.DatabaseEmptyError]
    other = "Gemäß der angegebenen Konfiguration wurde ein leerer Datenbankoperator abgerufen."
    [main.DatabaseChangingWarn]
    other = "Aufgrund eines internen Fehlers wird die aktuell verwendete Datenbank nicht gewechselt."
    [main.TerminationSignalWarn]
    other = "Signal <{{.SignalStr}}> zum Beenden des b0gus-Servers empfangen."
	[main.FailToApplyConfiguration]
	other = "Die angegebene Konfigurationsdatei kann nicht auf die aktuelle Konfiguration angewendet werden."

[crypto_aux]
    [crypto_aux.PemFileOpenFailure]
    other = "PEM-Datei <{{.PemPath}}> kann nicht zum Konfigurieren des lokalen SSH-Public Keys geöffnet werden!"
    [crypto_aux.PemFileReadFailure]
    other = "Die angegebene PEM-Datei kann nicht gelesen werden!"
    [crypto_aux.PemFileDecodeFailure]
    other = "PEM-Datei kann nicht korrekt decodiert werden!"
    [crypto_aux.PemFileUnsupportedTypeError]
    other = "Nicht unterstützter PEM-Dateityp!"
    [crypto_aux.PemFileFormatError]
    other = "Format dieser Signaturzertifikate wird nicht unterstützt."
    [crypto_aux.InvalidLengthForEllipticCurveError]
    other = "Die angegebene Public-Key-Länge <{{.PemLen}}> ist für bekannte Elliptic-Curve-Verschlüsselungsalgorithmen nicht geeignet."
    [crypto_aux.InvalidLengthForRSAError]
    other = "Die angegebene Public-Key-Länge <{{.PemLen}}> ist für den RSA-Verschlüsselungsalgorithmus nicht geeignet."
    [crypto_aux.SSHPrivateKeyGenFailure]
    other = "SSH-Private-Key konnte aufgrund des Fehlers <{{.ErrInfo}}> nicht gemäß dem angegebenen Algorithmus generiert werden."
    [crypto_aux.SSHPrivateKeySetFailure]
    other = "Private-Key konnte aufgrund des Fehlers <{{.ErrInfo}}> nicht für den SSH-Dienst gesetzt werden."
    [crypto_aux.CreatePemToGivenPathError]
    other = "Zertifikat kann nicht unter dem angegebenen Pfad <{{.PemPath}}> erstellt werden."
    [crypto_aux.Base64EncodeFailure]
    other = "Zertifikat kann nicht korrekt in einen Base64-String codiert werden."
    [crypto_aux.UnsupportedOrInvalidPemWarn]
    other = "Ungültiges oder nicht unterstütztes Zertifikat verwendet, Details: <{{.ErrInfo}}>. b0gus wird versuchen, gemäß der Konfiguration ein Zertifikat zu generieren."
    [crypto_aux.PemFileCreateFailure]
    other = "Zertifikat kann aufgrund des Fehlers <{{.ErrInfo}}> nicht unter dem Pfad <{{.PemPath}}> erstellt werden, und der b0gus-Dienst wird nicht gestartet."

[databases]
    [databases.DatabaseTypeError]
    other = "Nicht unterstützte Datenbank <{{.Database}}> gefunden!"

[configs]
    # Datenbank
    [configs.InvalidDatabaseAddrError]
    other = "Ungültige Datenbankverbindungsadresse <{{.DatabaseAddr}}> in der Konfigurationsdatei angegeben!"
    [configs.UnsupportDatabaseTypeError]
    other = "Unbekannter Datenbanktyp gefunden. b0gus unterstützt derzeit PostgreSQL, SQLite und MongoDB, Sie haben <{{.DatabaseType}}> ausgewählt."
