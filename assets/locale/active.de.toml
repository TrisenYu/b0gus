    [configs.ReadingConfigurationFailure]
    other = "Konfiguration kann nicht gelesen werden. Fehlergrund: <{{.ErrInfo}}>."
    [configs.ReloadingConfigurationFailure]
    other = "Neuladen der Konfigurationsdatei fehlgeschlagen! Aktuelle Konfiguration wird nicht geändert. Fehlergrund: <{{.ErrInfo}}>."
    [configs.UnmarshallingConfigurationFailure]
    other = "Konfigurationsdatei kann nicht geparst werden. Fehlergrund: <{{.ErrInfo}}>."

