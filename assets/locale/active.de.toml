[main]
    [main.DatabaseConnectionError]
    other = "Kann keine Verbindung zur Datenbank {{.DatabaseStr}} herstellen. Fehler: <{{.ErrInfo}}>."
    [main.DatabaseEmptyError]
    other = "Aufgrund der angegebenen Konfiguration wurde ein leerer Datenbankoperator abgerufen."
    [main.DatabaseChangingWarn]
    other = "Aufgrund eines internen Fehlers wird die aktuell verwendete Datenbank nicht gewechselt."
    [main.TerminationSignalWarn]
    other = "Signal <{{.SignalStr}}> zum Beenden des b0gus-Servers abgefangen."
