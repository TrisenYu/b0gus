    other = "Nicht unterstützte PEM-Datei!"
    [crypto_aux.PemFileFormatError]
    other = "Format dieses Signaturzertifikats wird nicht unterstützt"
    [crypto_aux.InvalidLengthForEllipticCurveError]
    other = "Die bereitgestellte Länge des öffentlichen Schlüssels <{{.PemLen}}> ist für bekannte Elliptische-Kurven-Kryptografie-Algorithmen nicht geeignet."
