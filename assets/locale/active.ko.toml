[configs]
    # 데이터베이스
    [configs.InvalidDatabaseAddrError]
    other = "구성 파일에 유효하지 않은 데이터베이스 연결 주소<{{.DatabaseAddr}}>가 제공되었습니다!"
    [configs.UnsupportDatabaseTypeError]
    other = "알 수 없는 데이터베이스 유형이 발견되었습니다. 현재 b0gus는 PostgreSQL、SQLite、MongoDB를 지원하지만, 선택하신 것은 <{{.DatabaseType}}>입니다."
    # 전역 구성 정보
