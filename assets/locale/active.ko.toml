    other = "주어진 주소<{{.ListenAddr}}>로 전환하여 다시 수신할 수 없습니다. 이로 인해 현재 b0gus SSH 서버가 수정되지 않습니다."
    [services.SSHSetupListenerError]
    other = "주어진 주소<{{.ListenAddr}}>에서 SSH 서버가 수신하도록 설정할 수 없습니다."
    [services.SSHAcceptConnWarn]
    other = "오류<{{.ErrInfo}}>로 인해 외부 SSH 연결 요청을 수락할 수 없습니다."
