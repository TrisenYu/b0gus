[meta_conf]
    [meta_conf.AssetsDir]
    other = "정적 자원 디렉터리를 설정합니다."
    [meta_conf.ConfPath]
    other = "로컬 설정 파일의 경로입니다."
    [meta_conf.PermitConfAlterInRuntime]
    other = "실행 중 설정 변경을 허용하는 설정입니다."
    [meta_conf.PermitSelfAlterInRuntime]
    other = "실행 중 설정 자체 변경을 허용하는 설정입니다."
    [meta_conf.PermitShellAlterInRuntime]
    other = "실행 중 셸 입력을 통해 설정 변경을 허용하는 권한 설정입니다."
    [meta_conf.PermitRemotePullInRuntime]
    other = "실행 중 원격에서 설정을 가져와 변경을 완료하는 권한 설정입니다."

[main]
    [main.DatabaseConnectionError]
    other = "데이터베이스{{.DatabaseStr}}에 연결할 수 없습니다. 오류: <{{.ErrInfo}}>."
    [main.DatabaseEmptyError]
    other = "주어진 설정으로 빈 데이터베이스 연산자를 얻었습니다."
    [main.DatabaseChangingWarn]
    other = "내부 오류로 인해 현재 사용 중인 데이터베이스를 변경하지 않습니다."
    [main.TerminationSignalWarn]
    other = "b0gus 서버 종료 신호<{{.SignalStr}}>를 포착했습니다."
	[main.FailToApplyConfiguration]
	other = "주어진 설정 파일을 현재 설정에 적용할 수 없습니다."

[crypto_aux]
    [crypto_aux.PemFileOpenFailure]
    other = "로컬 SSH 공개 키를 설정하기 위해 PEM 파일<{{.PemPath}}>을 열 수 없습니다!"
    [crypto_aux.PemFileReadFailure]
    other = "주어진 PEM 파일을 읽을 수 없습니다!"
    [crypto_aux.PemFileDecodeFailure]
    other = "PEM 파일을 올바르게 디코딩할 수 없습니다!"
    [crypto_aux.PemFileUnsupportedTypeError]
    other = "지원되지 않는 PEM 파일입니다!"
    [crypto_aux.PemFileFormatError]
    other = "이러한 서명 인증서의 형식을 지원하지 않습니다."
    [crypto_aux.InvalidLengthForEllipticCurveError]
    other = "제공된 공개 키 길이<{{.PemLen}}>가 알려진 타원 곡선 암호화 알고리즘에 적합하지 않습니다."
    [crypto_aux.InvalidLengthForRSAError]
    other = "제공된 공개 키 길이<{{.PemLen}}>가 RSA 암호화 알고리즘에 적합하지 않습니다."
    [crypto_aux.SSHPrivateKeyGenFailure]
    other = "오류<{{.ErrInfo}}>로 인해 주어진 알고리즘으로 SSH 개인 키를 생성할 수 없습니다."
    [crypto_aux.SSHPrivateKeySetFailure]
    other = "오류<{{.ErrInfo}}>로 인해 SSH 서비스에 개인 키를 설정할 수 없습니다."
    [crypto_aux.CreatePemToGivenPathError]
    other = "주어진 경로<{{.PemPath}}>에 인증서를 생성할 수 없습니다."
    [crypto_aux.Base64EncodeFailure]
    other = "인증서를 Base64 문자열로 올바르게 인코딩할 수 없습니다."
    [crypto_aux.UnsupportedOrInvalidPemWarn]
    other = "유효하지 않거나 지원되지 않는 인증서를 사용했습니다. 세부 사항: <{{.ErrInfo}}>. b0gus는 설정에 따라 인증서를 생성하려고 시도합니다."
    [crypto_aux.PemFileCreateFailure]
    other = "오류<{{.ErrInfo}}>로 인해 경로<{{.PemPath}}>에 인증서를 생성할 수 없으며, b0gus 서비스를 시작하지 않습니다."

[databases]
    [databases.DatabaseTypeError]
    other = "지원되지 않는 데이터베이스<{{.Database}}>를 발견했습니다!"
	[databases.InvalidMongoDBclientErr]
	other = "유효하지 않은 MongoDB 클라이언트입니다!"

[configs]
    # 데이터베이스
    [configs.InvalidDatabaseAddrError]
    other = "설정 파일에 유효하지 않은 데이터베이스 연결 주소<{{.DatabaseAddr}}>가 제공되었습니다!"
    [configs.UnsupportDatabaseTypeError]
    other = "알 수 없는 데이터베이스 유형을 발견했습니다. 현재 b0gus는 PostgreSQL, SQLite 및 MongoDB를 지원하며, 선택한 것은<{{.DatabaseType}}>입니다."
    # 전역 설정 정보
    [configs.ReadingConfigurationFailure]
    other = "설정을 읽을 수 없습니다. 실패 이유: <{{.ErrInfo}}>."
    [configs.ReloadingConfigurationFailure]
    other = "설정 파일을 다시 로드하는 데 실패했습니다! 현재 설정을 변경하지 않습니다. 실패 이유: <{{.ErrInfo}}>."
    [configs.UnmarshallingConfigurationFailure]
    other = "설정 파일을 구문 분석할 수 없습니다. 실패 이유: <{{.ErrInfo}}>."

[services]
	# abstract_tcpip
	[services.absTCPIPPortErr]
	other = "특권 포트를 선택했습니다."
