	other = "알 수 없는 네트워크 유형을 사용했습니다."
	[services.absTCPIPUDPConnCastingErr]
	other = "net.UDPConn 변환에 실패했습니다."
    # SSH
    [services.SSHversionWarn]
    other = "3개의 무작위 바이트를 생성할 수 없습니다. SSH 버전에 대해 기본값을 반환합니다."
    [services.SSHWriteResponseError]
    other = "명령 결과를 다시 쓸 때 오류<{{.ErrInfo}}>가 발생했습니다."
    [services.SSHsetTimeoutError]
    other = "오류<{{.ErrInfo}}>로 인해 다가오는 연결에 대한 시간 제한을 설정할 수 없습니다."
    [services.SSHEstablishConnectionFailure]
    other = "SSH 연결을 설정할 수 없습니다. (원격 주소, 현재 SSH 버전, 실패 이유): (<{{.RemoteAddr}}>, <{{.CurrSSHver}}>, <{{.ErrInfo}}>)."
    [services.SSHchannelAcceptanceError]
    other = "오류<{{.ErrInfo}}>로 인해 원격 주소<{{.RemoteAddr}}>에 제공된 SSH 채널을 수락할 수 없습니다."
    [services.SSHinvalidConfigurationWarn]
    other = "유효하지 않은 SSH 설정, 업데이트 건너뜀"
