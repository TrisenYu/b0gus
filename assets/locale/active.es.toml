    other = "No se puede codificar correctamente el certificado como una cadena Base64."
    [crypto_aux.UnsupportedOrInvalidPemWarn]
    other = "Se utilizó un certificado no válido o no soportado, detalles: <{{.ErrInfo}}>. b0gus intentará generar un certificado según la configuración."
