    other = "¡Archivo PEM no soportado!"
    [crypto_aux.PemFileFormatError]
    other = "Formato de certificado de firma no soportado."
    [crypto_aux.InvalidLengthForEllipticCurveError]
    other = "La longitud de la clave pública proporcionada <{{.PemLen}}> no es aplicable para algoritmos de cifrado de curva elíptica conocidos."
