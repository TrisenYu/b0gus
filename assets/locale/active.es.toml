[meta_conf]
    [meta_conf.AssetsDir]
    other = "Establecer el directorio de recursos estáticos."
    [meta_conf.ConfPath]
    other = "Ruta del archivo de configuración local."
    [meta_conf.PermitConfAlterInRuntime]
    other = "Permitir cambios en la configuración durante la ejecución."
    [meta_conf.PermitSelfAlterInRuntime]
    other = "Permitir que la configuración se modifique a sí misma durante la ejecución."
    [meta_conf.PermitShellAlterInRuntime]
    other = "Permitir cambios en la configuración mediante comandos en el shell durante la ejecución."
    [meta_conf.PermitRemotePullInRuntime]
    other = "Permitir cambios en la configuración mediante extracción remota durante la ejecución."

[main]
    [main.DatabaseConnectionError]
    other = "No se puede conectar a la base de datos {{.DatabaseStr}}. Error detectado: <{{.ErrInfo}}>."
    [main.DatabaseEmptyError]
    other = "Se obtuvo un operador de base de datos vacío según la configuración dada."
    [main.DatabaseChangingWarn]
    other = "Debido a un error interno, no se reemplazará la base de datos en uso."
    [main.TerminationSignalWarn]
    other = "Se capturó la señal de terminación del servidor b0gus <{{.SignalStr}}>."
	[main.FailToApplyConfiguration]
	other = "No se puede aplicar el archivo de configuración dado a la configuración actual."

[crypto_aux]
    [crypto_aux.PemFileOpenFailure]
    other = "No se puede abrir el archivo PEM <{{.PemPath}}> para configurar la clave pública SSH local."
    [crypto_aux.PemFileReadFailure]
    other = "No se puede leer el archivo PEM dado."
    [crypto_aux.PemFileDecodeFailure]
    other = "No se puede decodificar correctamente el archivo PEM."
    [crypto_aux.PemFileUnsupportedTypeError]
    other = "Tipo de archivo PEM no soportado."
    [crypto_aux.PemFileFormatError]
    other = "Formato de certificado de firma no soportado."
    [crypto_aux.InvalidLengthForEllipticCurveError]
    other = "La longitud de clave pública proporcionada <{{.PemLen}}> no es adecuada para los algoritmos de curva elíptica conocidos."
    [crypto_aux.InvalidLengthForRSAError]
    other = "La longitud de clave pública proporcionada <{{.PemLen}}> no es adecuada para el algoritmo RSA."
    [crypto_aux.SSHPrivateKeyGenFailure]
    other = "No se puede generar la clave privada SSH según el algoritmo dado debido al error <{{.ErrInfo}}>."
    [crypto_aux.SSHPrivateKeySetFailure]
    other = "No se puede establecer la clave privada para el servicio SSH debido al error <{{.ErrInfo}}>."
    [crypto_aux.CreatePemToGivenPathError]
    other = "No se puede crear el certificado en la ruta dada <{{.PemPath}}>."
    [crypto_aux.Base64EncodeFailure]
    other = "No se puede codificar correctamente el certificado en una cadena Base64."
    [crypto_aux.UnsupportedOrInvalidPemWarn]
    other = "Se utilizó un certificado inválido o no soportado, detalles: <{{.ErrInfo}}>. b0gus intentará generar un certificado según la configuración."
    [crypto_aux.PemFileCreateFailure]
    other = "No se puede crear el certificado en la ruta <{{.PemPath}}> debido al error <{{.ErrInfo}}>, y no se iniciará el servicio b0gus."

[databases]
    [databases.DatabaseTypeError]
    other = "Se encontró una base de datos no soportada <{{.Database}}>."
	[databases.InvalidMongoDBclientErr]
	other = "Cliente MongoDB inválido."

[configs]
    # base de datos
    [configs.InvalidDatabaseAddrError]
    other = "Se proporcionó una dirección de conexión de base de datos inválida en el archivo de configuración <{{.DatabaseAddr}}>."
    [configs.UnsupportDatabaseTypeError]
    other = "Se encontró un tipo de base de datos desconocido. Actualmente b0gus soporta PostgreSQL, SQLite y MongoDB, y usted seleccionó <{{.DatabaseType}}>."
    # información de configuración global
    [configs.ReadingConfigurationFailure]
    other = "No se puede leer la configuración. Motivo del fallo: <{{.ErrInfo}}>."
    [configs.ReloadingConfigurationFailure]
    other = "¡Falló la recarga del archivo de configuración! No se reemplazará la configuración actual. Motivo del fallo: <{{.ErrInfo}}>."
    [configs.UnmarshallingConfigurationFailure]
    other = "No se puede analizar el archivo de configuración. Motivo del fallo: <{{.ErrInfo}}>."

