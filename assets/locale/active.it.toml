    other = "Riscontrato un errore <{{.ErrInfo}}> durante la scrittura della risposta del comando."
    [services.SSHsetTimeoutError]
    other = "Impossibile impostare il timeout per la connessione in arrivo a causa dell'errore <{{.ErrInfo}}>."
