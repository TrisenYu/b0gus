[meta_conf]
    [meta_conf.AssetsDir]
    other = "Imposta la directory delle risorse statiche."
    [meta_conf.ConfPath]
    other = "Percorso del file di configurazione locale."
    [meta_conf.PermitConfAlterInRuntime]
    other = "Impostazione per consentire la modifica della configurazione durante l'esecuzione."
    [meta_conf.PermitSelfAlterInRuntime]
    other = "Impostazione per consentire l'auto-modifica della configurazione durante l'esecuzione."
    [meta_conf.PermitShellAlterInRuntime]
    other = "Impostazione dei permessi per modificare la configurazione tramite comandi shell durante l'esecuzione."
    [meta_conf.PermitRemotePullInRuntime]
    other = "Impostazione dei permessi per consentire la modifica della configurazione tramite il pull remoto durante l'esecuzione."

[main]
    [main.DatabaseConnectionError]
    other = "Impossibile connettersi al database {{.DatabaseStr}}. Errore rilevato: `{{.ErrInfo}}`."
    [main.DatabaseEmptyError]
    other = "Ottenuto un operatore di database vuoto con la configurazione fornita."
    [main.DatabaseChangingWarn]
    other = "Non si cambia il database attualmente in uso a causa di un errore interno."
    [main.TerminationSignalWarn]
    other = "Segnale di terminazione <{{.SignalStr}}> catturato per il server b0gus."
    [main.FailToApplyConfiguration]
    other = "Impossibile applicare il file di configurazione fornito alla configurazione corrente."

[crypto_aux]
    [crypto_aux.PemFileOpenFailure]
    other = "Impossibile aprire il file PEM <{{.PemPath}}> per configurare la chiave pubblica SSH locale!"
    [crypto_aux.PemFileReadFailure]
    other = "Impossibile leggere il file PEM fornito!"
    [crypto_aux.PemFileDecodeFailure]
    other = "Impossibile decodificare correttamente il file PEM!"
    [crypto_aux.PemFileUnsupportedTypeError]
    other = "Tipo di file PEM non supportato!"
    [crypto_aux.PemFileFormatError]
    other = "Formato del certificato di firma non supportato."
    [crypto_aux.InvalidLengthForEllipticCurveError]
    other = "La lunghezza della chiave pubblica fornita <{{.PemLen}}> non è adatta per algoritmi di crittografia a curva ellittica noti."
    [crypto_aux.InvalidLengthForRSAError]
    other = "La lunghezza della chiave pubblica fornita <{{.PemLen}}> non è adatta per l'algoritmo di crittografia RSA."
    [crypto_aux.SSHPrivateKeyGenFailure]
    other = "Impossibile generare la chiave privata SSH con l'algoritmo fornito a causa dell'errore <{{.ErrInfo}}>."
    [crypto_aux.SSHPrivateKeySetFailure]
    other = "Impossibile impostare la chiave privata per il servizio SSH a causa dell'errore <{{.ErrInfo}}>."
    [crypto_aux.CreatePemToGivenPathError]
    other = "Impossibile creare il certificato nel percorso fornito <{{.PemPath}}>."
    [crypto_aux.Base64EncodeFailure]
    other = "Impossibile codificare correttamente il certificato in una stringa Base64."
    [crypto_aux.UnsupportedOrInvalidPemWarn]
    other = "Utilizzato un certificato non valido o non supportato, dettagli: <{{.ErrInfo}}>. b0gus tenterà di generare un certificato in base alla configurazione."
    [crypto_aux.PemFileCreateFailure]
    other = "Impossibile creare il certificato nel percorso <{{.PemPath}}> a causa dell'errore <{{.ErrInfo}}>, e il servizio b0gus non verrà avviato."

[databases]
    [databases.DatabaseTypeError]
    other = "Rilevato database non supportato <{{.Database}}>!"

[configs]
    # Database
    [configs.InvalidDatabaseAddrError]
    other = "Indirizzo di connessione al database non valido <{{.DatabaseAddr}}> fornito nel file di configurazione!"
    [configs.UnsupportDatabaseTypeError]
    other = "Rilevato un tipo di database sconosciuto. b0gus attualmente supporta PostgreSQL, SQLite e MongoDB, ma è stato selezionato <{{.DatabaseType}}>."
    # Informazioni di configurazione globale
    [configs.ReadingConfigurationFailure]
    other = "Impossibile leggere la configurazione. Motivo del fallimento: <{{.ErrInfo}}>."
    [configs.ReloadingConfigurationFailure]
    other = "Ricaricamento del file di configurazione fallito! La configurazione corrente non verrà modificata. Motivo del fallimento: <{{.ErrInfo}}>."
    [configs.UnmarshallingConfigurationFailure]
    other = "Impossibile analizzare il file di configurazione. Motivo del fallimento: <{{.ErrInfo}}>."

