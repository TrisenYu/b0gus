    [services.NTPReceivePayloadFromRemoteInfo]
    other = "Il server NTP ha ricevuto una richiesta di interrogazione temporale di lunghezza <{{.Len}}> da <{{.IP}}>."
    [services.NTPQuitInfo]
    other = "Servizio NTP terminato."
    [services.NTPNullConfErr]
    other = "Fornita configurazione NTP nulla."
    # DNS
    [services.DNSQuitInfo]
    other = "Servizio DNS terminato."
    [services.DNSNullConfErr]
    other = "Fornita configurazione DNS nulla."
    [services.DNSWrongParamNumErr]
    other = "Passato un numero errato di parametri. Previsti {{.Expect}}, effettivi {{.Actual}}."
    [services.DNSConfLoadErr]
    other = "Impossibile estrarre la sottoconfigurazione DNS dalla configurazione!"
    # SMTP
    [services.SMTPQuitInfo]
    other = "Servizio SMTP terminato."
    [services.SMTPWrongParamNumErr]
    other = "Passato un numero errato di parametri. Previsti {{.Expect}}, effettivi {{.Actual}}."
    [services.SMTPNullConfErr]
    other = "Fornita configurazione SMTP nulla."
