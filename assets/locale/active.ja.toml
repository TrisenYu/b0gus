[meta_conf]
    [meta_conf.AssetsDir]
    other = "静的リソースのディレクトリを設定します。"
    [meta_conf.ConfPath]
    other = "ローカル設定ファイルのパス。"
    [meta_conf.PermitConfAlterInRuntime]
    other = "実行中に設定の変更を許可する設定。"
    [meta_conf.PermitSelfAlterInRuntime]
    other = "実行中に設定の自己変更を許可する設定。"
    [meta_conf.PermitShellAlterInRuntime]
    other = "実行中にシェルへのコマンド入力による設定変更を許可する権限設定。"
    [meta_conf.PermitRemotePullInRuntime]
    other = "実行中にリモートからの設定取得による変更を許可する権限設定。"

[main]
    [main.DatabaseConnectionError]
    other = "データベース{{.DatabaseStr}}に接続できません。エラー詳細：`{{.ErrInfo}}`。"
    [main.DatabaseEmptyError]
    other = "指定された設定で空のデータベース演算子が取得されました。"
    [main.DatabaseChangingWarn]
    other = "内部エラーのため、現在使用中のデータベースは変更されません。"
    [main.TerminationSignalWarn]
    other = "b0gusサーバーの終了シグナル<{{.SignalStr}}>を検出しました。"
	[main.FailToApplyConfiguration]
	other = "指定された設定ファイルを現在の設定に適用できません。"

[crypto_aux]
    [crypto_aux.PemFileOpenFailure]
    other = "ローカルのSSH公開鍵を設定するためにPEMファイル<{{.PemPath}}>を開けません！"
    [crypto_aux.PemFileReadFailure]
    other = "指定されたPEMファイルを読み取れません！"
    [crypto_aux.PemFileDecodeFailure]
    other = "PEMファイルを正しくデコードできません！"
    [crypto_aux.PemFileUnsupportedTypeError]
    other = "サポートされていないPEMファイルです！"
    [crypto_aux.PemFileFormatError]
    other = "この署名証明書の形式はサポートされていません"
    [crypto_aux.InvalidLengthForEllipticCurveError]
    other = "指定された公開鍵の長さ<{{.PemLen}}>は既知の楕円曲線暗号アルゴリズムに適用できません。"
    [crypto_aux.InvalidLengthForRSAError]
    other = "指定された公開鍵の長さ<{{.PemLen}}>はRSA暗号アルゴリズムに適用できません。"
    [crypto_aux.SSHPrivateKeyGenFailure]
    other = "エラー<{{.ErrInfo}}>により、指定されたアルゴリズムでSSH秘密鍵を生成できません。"
    [crypto_aux.SSHPrivateKeySetFailure]
    other = "エラー<{{.ErrInfo}}>により、SSHサービスに秘密鍵を設定できません。"
    [crypto_aux.CreatePemToGivenPathError]
    other = "指定されたパス<{{.PemPath}}>に証明書を作成できません。"
    [crypto_aux.Base64EncodeFailure]
    other = "証明書をBase64文字列に正しくエンコードできません。"
    [crypto_aux.UnsupportedOrInvalidPemWarn]
    other = "無効またはサポートされていない証明書が使用されました。詳細：<{{.ErrInfo}}>。b0gusは設定に従って証明書の生成を試みます。"
    [crypto_aux.PemFileCreateFailure]
    other = "エラー<{{.ErrInfo}}>により、パス<{{.PemPath}}>に証明書を作成できず、b0gusサービスは起動されません。"

[databases]
    [databases.DatabaseTypeError]
    other = "サポートされていないデータベース<{{.Database}}>が検出されました！"

[configs]
    # データベース
    [configs.InvalidDatabaseAddrError]
    other = "設定ファイル内に無効なデータベース接続アドレス<{{.DatabaseAddr}}>が指定されています！"
    [configs.UnsupportDatabaseTypeError]
    other = "未知のデータベースタイプが検出されました。現在b0gusはPostgreSQL、SQLite、MongoDBをサポートしており、選択されたのは<{{.DatabaseType}}>です。"
    # グローバル設定情報
    [configs.ReadingConfigurationFailure]
    other = "設定を読み取れません。失敗原因：<{{.ErrInfo}}>。"
    [configs.ReloadingConfigurationFailure]
    other = "設定ファイルの再読み込みに失敗しました！現在の設定は変更されません。失敗原因：<{{.ErrInfo}}>。"
    [configs.UnmarshallingConfigurationFailure]
    other = "設定ファイルを解析できません。失敗原因：<{{.ErrInfo}}>。"

