[main]
    [main.DatabaseConnectionError]
    other = "Cannot connect to database {{.DatabaseStr}}. Error detected: <{{.ErrInfo}}>."
    [main.DatabaseEmptyError]
    other = "Empty database operator obtained from given configuration."
