    other = "Обнаружен неизвестный тип базы данных. В настоящее время b0gus поддерживает PostgreSQL, SQLite и MongoDB, а вы выбрали <{{.DatabaseType}}>."
    # Глобальная конфигурация
    [configs.ReadingConfigurationFailure]
    other = "Не удалось прочитать конфигурацию. Причина сбоя: <{{.ErrInfo}}>."
    [configs.ReloadingConfigurationFailure]
    other = "Не удалось перезагрузить конфигурационный файл! Текущая конфигурация не заменяется. Причина сбоя: <{{.ErrInfo}}>."
