[meta_conf]
    [meta_conf.AssetsDir]
	# информация о тесте
		other = "Установите каталог для статических ресурсов."
    [meta_conf.ConfPath]
    other = "Путь к локальному конфигурационному файлу."
    [meta_conf.PermitConfAlterInRuntime]
    other = "Настройка разрешения изменения конфигурации во время выполнения."
    [meta_conf.PermitSelfAlterInRuntime]
    other = "Настройка разрешения самоизменения конфигурации во время выполнения."
    [meta_conf.PermitShellAlterInRuntime]
    other = "Настройка разрешения изменения конфигурации во время выполнения путем ввода команд в оболочку."
