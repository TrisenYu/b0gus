    other = "Настройка разрешения изменения конфигурации во время выполнения путем удаленного вытягивания."

[main]
    [main.TerminationSignalWarn]
    other = "Получен сигнал завершения работы сервера b0gus <{{.SignalStr}}>."
	[main.FailToApplyConfiguration]
	other = "Невозможно применить заданный конфигурационный файл к текущей конфигурации."

[crypto_aux]
    [crypto_aux.PemFileOpenFailure]
    other = "Не удалось открыть PEM-файл <{{.PemPath}}> для настройки локального открытого ключа SSH!"
