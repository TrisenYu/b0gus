    other = "Не удалось создать сертификат по заданному пути <{{.PemPath}}>."
    [crypto_aux.Base64EncodeFailure]
    other = "Не удалось правильно закодировать сертификат в строку Base64."
    [crypto_aux.UnsupportedOrInvalidPemWarn]
    other = "Использован недействительный или неподдерживаемый сертификат, подробности: <{{.ErrInfo}}>. b0gus попытается сгенерировать сертификат в соответствии с конфигурацией."
    [crypto_aux.PemFileCreateFailure]
    other = "Не удалось создать сертификат по пути <{{.PemPath}}> из-за ошибки <{{.ErrInfo}}>, и служба b0gus не будет запущена."

[databases]
