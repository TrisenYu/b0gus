[meta_conf]
    [meta_conf.AssetsDir]
    other = "Задать каталог статических ресурсов."
    [meta_conf.ConfPath]
    other = "Путь к локальному конфигурационному файлу."
    [meta_conf.PermitConfAlterInRuntime]
    other = "Настройка разрешения изменений конфигурации во время выполнения."
    [meta_conf.PermitSelfAlterInRuntime]
    other = "Настройка разрешения самоизменения конфигурации во время выполнения."
    [meta_conf.PermitShellAlterInRuntime]
    other = "Настройка разрешения изменения конфигурации через ввод команд в оболочку во время выполнения."
    [meta_conf.PermitRemotePullInRuntime]
    other = "Настройка разрешения изменения конфигурации путём удалённого извлечения во время выполнения."

[main]
    [main.DatabaseConnectionError]
    other = "Не удалось подключиться к базе данных {{.DatabaseStr}}. Ошибка: <{{.ErrInfo}}>."
    [main.DatabaseEmptyError]
    other = "В соответствии с заданной конфигурацией получен пустой оператор базы данных."
    [main.DatabaseChangingWarn]
    other = "Из-за внутренней ошибки текущая используемая база данных не заменяется."
    [main.TerminationSignalWarn]
    other = "Перехвачен сигнал завершения работы сервера b0gus <{{.SignalStr}}>."
	[main.FailToApplyConfiguration]
	other = "Не удалось применить заданный конфигурационный файл к текущей конфигурации."

[crypto_aux]
    [crypto_aux.PemFileOpenFailure]
    other = "Не удалось открыть PEM-файл <{{.PemPath}}> для настройки локального открытого ключа SSH!"
    [crypto_aux.PemFileReadFailure]
    other = "Не удалось прочитать заданный PEM-файл!"
    [crypto_aux.PemFileDecodeFailure]
    other = "Не удалось правильно декодировать PEM-файл!"
    [crypto_aux.PemFileUnsupportedTypeError]
    other = "Неподдерживаемый PEM-файл!"
    [crypto_aux.PemFileFormatError]
    other = "Неподдерживаемый формат сертификата подписи"
    [crypto_aux.InvalidLengthForEllipticCurveError]
    other = "Предоставленная длина открытого ключа <{{.PemLen}}> не подходит для известных алгоритмов эллиптической криптографии."
    [crypto_aux.InvalidLengthForRSAError]
    other = "Предоставленная длина открытого ключа <{{.PemLen}}> не подходит для алгоритма шифрования RSA."
    [crypto_aux.SSHPrivateKeyGenFailure]
    other = "Из-за ошибки <{{.ErrInfo}}> не удалось сгенерировать закрытый ключ SSH по заданному алгоритму."
    [crypto_aux.SSHPrivateKeySetFailure]
    other = "Из-за ошибки <{{.ErrInfo}}> не удалось установить закрытый ключ для службы SSH."
    [crypto_aux.CreatePemToGivenPathError]
    other = "Не удалось создать сертификат по заданному пути <{{.PemPath}}>."
    [crypto_aux.Base64EncodeFailure]
    other = "Не удалось правильно закодировать сертификат в строку Base64."
    [crypto_aux.UnsupportedOrInvalidPemWarn]
    other = "Использован недействительный или неподдерживаемый сертификат, подробности: <{{.ErrInfo}}>. b0gus попытается сгенерировать сертификат в соответствии с конфигурацией."
    [crypto_aux.PemFileCreateFailure]
    other = "Из-за ошибки <{{.ErrInfo}}> не удалось создать сертификат по пути <{{.PemPath}}>, и служба b0gus не будет запущена."

[databases]
    [databases.DatabaseTypeError]
    other = "Обнаружена неподдерживаемая база данных <{{.Database}}>!"
	[databases.InvalidMongoDBclientErr]
	other = "Недействительный клиент MongoDB!"

[configs]
    # База данных
    [configs.InvalidDatabaseAddrError]
    other = "В конфигурационном файле указан недействительный адрес подключения к базе данных <{{.DatabaseAddr}}>!"
    [configs.UnsupportDatabaseTypeError]
    other = "Обнаружен неизвестный тип базы данных. В настоящее время b0gus поддерживает PostgreSQL, SQLite и MongoDB, а вы выбрали <{{.DatabaseType}}>."
    # Глобальная конфигурация
    [configs.ReadingConfigurationFailure]
    other = "Не удалось прочитать конфигурацию. Причина сбоя: <{{.ErrInfo}}>."
    [configs.ReloadingConfigurationFailure]
    other = "Не удалось перезагрузить конфигурационный файл! Текущая конфигурация не будет заменена. Причина сбоя: <{{.ErrInfo}}>."
    [configs.UnmarshallingConfigurationFailure]
    other = "Не удалось разобрать конфигурационный файл. Причина сбоя: <{{.ErrInfo}}>."

