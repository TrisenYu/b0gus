    other = "Недействительная конфигурация SSH, пропуск обновления."
    [services.SSHSwitchListenerError]
    other = "Не удалось переключиться на указанный адрес <{{.ListenAddr}}> для повторного прослушивания. Текущий SSH-сервер b0gus не будет изменён."
    [services.SSHSetupListenerError]
    other = "Не удалось запустить прослушивание SSH-сервером на указанном адресе <{{.ListenAddr}}>."
    [services.SSHAcceptConnWarn]
    other = "Не удалось принять внешний SSH-запрос на соединение из-за ошибки <{{.ErrInfo}}>."
    [services.SSHCanNotUseSigner]
    other = "Не удалось использовать указанный сертификат <{{.Signer}}> для подписи во время взаимодействия по протоколу SSH."
    [services.SSHQuitInfo]
    other = "Служба SSH завершена."
    # NTP
    [services.NTPReceivePayloadFromRemoteInfo]
    other = "NTP-сервер получил запрос на синхронизацию времени длиной <{{.Len}}> от <{{.IP}}>."
