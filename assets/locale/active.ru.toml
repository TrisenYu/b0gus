    other = "Не удалось переключиться на заданный адрес <{{.ListenAddr}}> для повторного прослушивания. Текущий SSH-сервер b0gus не будет изменён."
    [services.SSHSetupListenerError]
    other = "Не удалось запустить прослушивание SSH-сервера по заданному адресу <{{.ListenAddr}}>."
    [services.SSHAcceptConnWarn]
    other = "Из-за ошибки <{{.ErrInfo}}> не удалось принять внешний запрос SSH-соединения."
