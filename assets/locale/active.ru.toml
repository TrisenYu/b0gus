[meta_conf]
    [meta_conf.AssetsDir]
    other = "Каталог для статических ресурсов."
    [meta_conf.ConfPath]
    other = "Путь к локальному файлу конфигурации."
    [meta_conf.PermitConfAlterInRuntime]
    other = "Настройка, разрешающая изменение конфигурации во время выполнения."
    [meta_conf.PermitSelfAlterInRuntime]
    other = "Настройка, разрешающая самопроизвольное изменение конфигурации во время выполнения."
    [meta_conf.PermitShellAlterInRuntime]
    other = "Настройка прав, разрешающая изменение конфигурации через ввод команд в оболочку во время выполнения."
    [meta_conf.PermitRemotePullInRuntime]
    other = "Настройка прав, разрешающая изменение конфигурации путём загрузки с удалённого источника во время выполнения."

[main]
    [main.DatabaseConnectionError]
    other = "Не удалось подключиться к базе данных {{.DatabaseStr}}. Проверьте ошибку: `{{.ErrInfo}}`."
    [main.DatabaseEmptyError]
    other = "Получен пустой оператор базы данных согласно заданной конфигурации."
    [main.DatabaseChangingWarn]
    other = "Из-за внутренней ошибки текущая используемая база данных не будет заменена."
    [main.TerminationSignalWarn]
    other = "Получен сигнал <{{.SignalStr}}> для завершения работы сервера b0gus."
    [main.FailToApplyConfiguration]
    other = "Не удалось применить заданный файл конфигурации к текущей конфигурации."

[crypto_aux]
    [crypto_aux.PemFileOpenFailure]
    other = "Не удалось открыть PEM-файл <{{.PemPath}}> для настройки локального SSH-ключа!"
    [crypto_aux.PemFileReadFailure]
    other = "Не удалось прочитать указанный PEM-файл!"
    [crypto_aux.PemFileDecodeFailure]
    other = "Не удалось корректно декодировать PEM-файл!"
    [crypto_aux.PemFileUnsupportedTypeError]
    other = "Неподдерживаемый тип PEM-файла!"
    [crypto_aux.PemFileFormatError]
    other = "Формат данного сертификата подписи не поддерживается."
    [crypto_aux.InvalidLengthForEllipticCurveError]
    other = "Предоставленная длина открытого ключа <{{.PemLen}}> не подходит для известных алгоритмов эллиптических кривых."
    [crypto_aux.InvalidLengthForRSAError]
    other = "Предоставленная длина открытого ключа <{{.PemLen}}> не подходит для алгоритма RSA."
    [crypto_aux.SSHPrivateKeyGenFailure]
    other = "Не удалось сгенерировать SSH-закрытый ключ по заданному алгоритму из-за ошибки <{{.ErrInfo}}>."
    [crypto_aux.SSHPrivateKeySetFailure]
    other = "Не удалось установить закрытый ключ для SSH-службы из-за ошибки <{{.ErrInfo}}>."
    [crypto_aux.CreatePemToGivenPathError]
    other = "Не удалось создать сертификат по указанному пути <{{.PemPath}}>."
    [crypto_aux.Base64EncodeFailure]
    other = "Не удалось корректно закодировать сертификат в строку Base64."
    [crypto_aux.UnsupportedOrInvalidPemWarn]
    other = "Использован недействительный или неподдерживаемый сертификат, детали: <{{.ErrInfo}}>. b0gus попытается сгенерировать сертификат в соответствии с конфигурацией."
    [crypto_aux.PemFileCreateFailure]
    other = "Не удалось создать сертификат по пути <{{.PemPath}}> из-за ошибки <{{.ErrInfo}}>, и служба b0gus не будет запущена."

[databases]
    [databases.DatabaseTypeError]
    other = "Обнаружена неподдерживаемая база данных <{{.Database}}>!"

[configs]
    # База данных
    [configs.InvalidDatabaseAddrError]
    other = "В файле конфигурации указан недействительный адрес подключения к базе данных <{{.DatabaseAddr}}>!"
    [configs.UnsupportDatabaseTypeError]
    other = "Обнаружен неизвестный тип базы данных. Текущая версия b0gus поддерживает PostgreSQL, SQLite и MongoDB, а выбран <{{.DatabaseType}}>."
    # Глобальная конфигурация
    [configs.ReadingConfigurationFailure]
    other = "Не удалось прочитать конфигурацию. Причина: <{{.ErrInfo}}>."
    [configs.ReloadingConfigurationFailure]
    other = "Не удалось перезагрузить файл конфигурации! Текущая конфигурация не будет изменена. Причина: <{{.ErrInfo}}>."
    [configs.UnmarshallingConfigurationFailure]
    other = "Не удалось разобрать файл конфигурации. Причина: <{{.ErrInfo}}>."

[services]
    # abstract_tcpip
    [services.absTCPIPUninitErr]
    other = "Использован неинициализированный ReentrantNetType."
    [services.absTCPIPUnknownNetType]
    other = "Использован неизвестный тип сети."
    [services.absTCPIPUDPConnCastingErr]
    other = "Не удалось преобразовать net.UDPConn."
    # SSH
    [services.SSHversionWarn]
    other = "Не удалось сгенерировать 3 случайных байта. Будет возвращено значение по умолчанию для версии SSH."
    [services.SSHWriteResponseError]
    other = "При записи результата команды произошла ошибка <{{.ErrInfo}}>."
    [services.SSHsetTimeoutError]
    other = "Не удалось установить время ожидания для входящего соединения из-за ошибки <{{.ErrInfo}}>."
    [services.SSHEstablishConnectionFailure]
    other = "Не удалось установить SSH-соединение. (Удалённый адрес, текущая версия SSH, причина): (<{{.RemoteAddr}}>, <{{.CurrSSHver}}>, <{{.ErrInfo}}>)."
    [services.SSHchannelAcceptanceError]
    other = "Не удалось принять SSH-канал, предоставленный удалённому адресу <{{.RemoteAddr}}>, из-за ошибки <{{.ErrInfo}}>."
