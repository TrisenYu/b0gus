	[services.HTTPQuitInfo]
	other = "Служба HTTP завершена"
	[services.HTTPNullConfErr]
	other = "Предоставлена пустая конфигурация HTTP"
	[services.HTTPWrongParamNumErr]
	other = "Передано неверное количество параметров. Ожидалось {{.Expect}}, фактически передано {{.Actual}}."
