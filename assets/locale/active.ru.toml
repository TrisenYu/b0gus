    other = "Служба NTP завершена."
    [services.NTPNullConfErr]
    other = "Предоставлена пустая конфигурация NTP."
    # DNS
    [services.DNSQuitInfo]
    other = "Служба DNS завершена."
    [services.DNSNullConfErr]
    other = "Предоставлена пустая конфигурация DNS."
    [services.DNSWrongParamNumErr]
    other = "Передано неверное количество параметров. Ожидалось {{.Expect}}, получено {{.Actual}}."
    [services.DNSConfLoadErr]
    other = "Не удалось извлечь подконфигурацию DNS из конфигурации!"
    # SMTP
    [services.SMTPQuitInfo]
    other = "Служба SMTP завершена."
    [services.SMTPWrongParamNumErr]
    other = "Передано неверное количество параметров. Ожидалось {{.Expect}}, получено {{.Actual}}."
    [services.SMTPNullConfErr]
    other = "Предоставлена пустая конфигурация SMTP."
    # HTTP
    [services.HTTPQuitInfo]
    other = "Служба HTTP завершена."
    [services.HTTPNullConfErr]
    other = "Предоставлена пустая конфигурация HTTP."
    [services.HTTPWrongParamNumErr]
    other = "Передано неверное количество параметров. Ожидалось {{.Expect}}, получено {{.Actual}}."
    [services.HTTPConfLoadErr]
    other = "Не удалось загрузить конфигурацию HTTP."
    # ICMP
    [services.ICMPwindowsUnsupportWarn]
    other = "Система Windows не поддерживает развёртывание ICMP-сервера."