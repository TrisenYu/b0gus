	other = "Χρησιμοποιήθηκε άγνωστος τύπος δικτύου."
	[services.absTCPIPUDPConnCastingErr]
	other = "Αποτυχία μετατροπής net.UDPConn."
    # SSH
    [services.SSHversionWarn]
    other = "Αδυναμία δημιουργίας 3 τυχαίων byte. Θα επιστραφεί μια προεπιλεγμένη τιμή για την έκδοση SSH."
    [services.SSHWriteResponseError]
    other = "Συνάντηση σφάλματος <{{.ErrInfo}}> κατά την επιστροφή του αποτελέσματος της εντολής."
    [services.SSHsetTimeoutError]
