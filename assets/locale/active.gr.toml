[meta_conf]
    [meta_conf.AssetsDir]
    other = "Ορισμός του καταλόγου στατικών πόρων."
    [meta_conf.ConfPath]
    other = "Διαδρομή του τοπικού αρχείου ρυθμίσεων."
    [meta_conf.PermitConfAlterInRuntime]
    other = "Ρύθμιση που επιτρέπει την αλλαγή ρυθμίσεων κατά τη διάρκεια εκτέλεσης."
    [meta_conf.PermitSelfAlterInRuntime]
    other = "Ρύθμιση που επιτρέπει την αυτο-αλλαγή ρυθμίσεων κατά τη διάρκεια εκτέλεσης."
    [meta_conf.PermitShellAlterInRuntime]
    other = "Ρύθμιση που επιτρέπει την αλλαγή ρυθμίσεων μέσω εντολών στο κέλυφος κατά τη διάρκεια εκτέλεσης."
    [meta_conf.PermitRemotePullInRuntime]
    other = "Ρύθμιση που επιτρέπει την αλλαγή ρυθμίσεων μέσω απομακρυσμένης λήψης κατά τη διάρκεια εκτέλεσης."

[main]
    [main.DatabaseConnectionError]
    other = "Αδυναμία σύνδεσης στη βάση δεδομένων {{.DatabaseStr}}. Σφάλμα: <{{.ErrInfo}}>."
    [main.DatabaseEmptyError]
    other = "Λήψη κενού τελεστή βάσης δεδομένων βάσει της δοθείσας ρύθμισης."
    [main.DatabaseChangingWarn]
    other = "Λόγω εσωτερικού σφάλματος, δεν γίνεται αλλαγή της τρέχουσας βάσης δεδομένων σε χρήση."
    [main.TerminationSignalWarn]
    other = "Λήψη σήματος τερματισμού του διακομιστή b0gus <{{.SignalStr}}>."
	[main.FailToApplyConfiguration]
	other = "Αδυναμία εφαρμογής του δοθέντος αρχείου ρυθμίσεων στην τρέχουσα διαμόρφωση."

[crypto_aux]
    [crypto_aux.PemFileOpenFailure]
    other = "Αδύνατο το άνοιγμα αρχείου PEM <{{.PemPath}}> για τη διαμόρφωση του τοπικού δημόσιου κλειδιού SSH!"
    [crypto_aux.PemFileReadFailure]
    other = "Αδυναμία ανάγνωσης του δοθέντος αρχείου PEM!"
    [crypto_aux.PemFileDecodeFailure]
    other = "Αδυναμία σωστής αποκωδικοποίησης του αρχείου PEM!"
    [crypto_aux.PemFileUnsupportedTypeError]
    other = "Μη υποστηριζόμενος τύπος αρχείου PEM!"
    [crypto_aux.PemFileFormatError]
    other = "Μη υποστηριζόμενη μορφή πιστοποιητικού υπογραφής"
    [crypto_aux.InvalidLengthForEllipticCurveError]
    other = "Το μήκος του δημόσιου κλειδιού <{{.PemLen}}> που δόθηκε δεν είναι κατάλληλο για γνωστούς αλγόριθμους κρυπτογράφησης ελλειπτικών καμπυλών."
    [crypto_aux.InvalidLengthForRSAError]
    other = "Το μήκος του δημόσιου κλειδιού <{{.PemLen}}> που δόθηκε δεν είναι κατάλληλο για τον αλγόριθμο κρυπτογράφησης RSA."
    [crypto_aux.SSHPrivateKeyGenFailure]
    other = "Λόγω σφάλματος <{{.ErrInfo}}> αδυναμία δημιουργίας ιδιωτικού κλειδιού SSH βάσει του δοθέντος αλγόριθμου."
    [crypto_aux.SSHPrivateKeySetFailure]
    other = "Λόγω σφάλματος <{{.ErrInfo}}> αδυναμία ρύθμισης ιδιωτικού κλειδιού για την υπηρεσία SSH."
    [crypto_aux.CreatePemToGivenPathError]
    other = "Αδυναμία δημιουργίας πιστοποιητικού στη δοθείσα διαδρομή <{{.PemPath}}>."
    [crypto_aux.Base64EncodeFailure]
    other = "Αδυναμία σωστής κωδικοποίησης του πιστοποιητικού σε συμβολοσειρά Base64."
    [crypto_aux.UnsupportedOrInvalidPemWarn]
    other = "Χρήση μη έγκυρου ή μη υποστηριζόμενου πιστοποιητικού, λεπτομέρειες: <{{.ErrInfo}}>. Το b0gus θα προσπαθήσει να δημιουργήσει ένα πιστοποιητικό ανάλογα με τη ρύθμιση."
    [crypto_aux.PemFileCreateFailure]
    other = "Λόγω σφάλματος <{{.ErrInfo}}> αδυναμία δημιουργίας πιστοποιητικού στη διαδρομή <{{.PemPath}}>, και η υπηρεσία b0gus δεν θα ξεκινήσει."

[databases]
    [databases.DatabaseTypeError]
    other = "Βρέθηκε μη υποστηριζόμενη βάση δεδομένων <{{.Database}}>!"
	[databases.InvalidMongoDBclientErr]
	other = "Μη έγκυρο πρόγραμμα-πελάτη MongoDB!"

[configs]
    # Βάση δεδομένων
    [configs.InvalidDatabaseAddrError]
    other = "Παρέχεται μη έγκυρη διεύθυνση σύνδεσης βάσης δεδομένων <{{.DatabaseAddr}}> στο αρχείο ρυθμίσεων!"
    [configs.UnsupportDatabaseTypeError]
    other = "Βρέθηκε άγνωστος τύπος βάσης δεδομένων. Το b0gus υποστηρίζει PostgreSQL, SQLite και MongoDB, ενώ εσύ επέλεξες <{{.DatabaseType}}>."
    # Παγκόσμιες πληροφορίες ρυθμίσεων
    [configs.ReadingConfigurationFailure]
    other = "Αδυναμία ανάγνωσης της ρύθμισης. Αιτία αποτυχίας: <{{.ErrInfo}}>."
    [configs.ReloadingConfigurationFailure]
    other = "Αποτυχία επαναφόρτωσης του αρχείου ρυθμίσεων! Δεν θα γίνει αλλαγή της τρέχουσας ρύθμισης. Αιτία αποτυχίας: <{{.ErrInfo}}>."
    [configs.UnmarshallingConfigurationFailure]
    other = "Αδυναμία ανάλυσης του αρχείου ρυθμίσεων. Αιτία αποτυχίας: <{{.ErrInfo}}>."

