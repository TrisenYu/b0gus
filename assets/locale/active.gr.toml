[meta_conf]
    [meta_conf.AssetsDir]
    other = "Ορίστε τον κατάλογο στατικών πόρων."
    [meta_conf.ConfPath]
    other = "Η διαδρομή του τοπικού αρχείου ρυθμίσεων."
    [meta_conf.PermitConfAlterInRuntime]
    other = "Ρύθμιση που επιτρέπει την τροποποίηση των ρυθμίσεων κατά τη διάρκεια εκτέλεσης."
    [meta_conf.PermitSelfAlterInRuntime]
    other = "Ρύθμιση που επιτρέπει την αυτόματη τροποποίηση των ρυθμίσεων κατά τη διάρκεια εκτέλεσης."
    [meta_conf.PermitShellAlterInRuntime]
    other = "Ρύθμιση δικαιωμάτων που επιτρέπει την τροποποίηση των ρυθμίσεων μέσω εισαγωγής εντολών στο Shell κατά τη διάρκεια εκτέλεσης."
    [meta_conf.PermitRemotePullInRuntime]
    other = "Ρύθμιση δικαιωμάτων που επιτρέπει την τροποποίηση των ρυθμίσεων μέσω λήψης από απομακρυσμένη πηγή κατά τη διάρκεια εκτέλεσης."

[main]
    [main.DatabaseConnectionError]
    other = "Αδυναμία σύνδεσης στη βάση δεδομένων {{.DatabaseStr}}. Σφάλμα ελέγχου: `{{.ErrInfo}}`."
    [main.DatabaseEmptyError]
    other = "Λήφθηκε κενός χειριστής βάσης δεδομένων με βάση τις δοθείσες ρυθμίσεις."
    [main.DatabaseChangingWarn]
    other = "Λόγω εσωτερικού σφάλματος, δεν αλλάζει η τρέχουσα βάση δεδομένων που χρησιμοποιείται."
    [main.TerminationSignalWarn]
    other = "Παγιδεύτηκε σήμα τερματισμού <{{.SignalStr}}> για τον διακομιστή b0gus."
	[main.FailToApplyConfiguration]
	other = "Αδυναμία εφαρμογής του δοθέντος αρχείου ρυθμίσεων στην τρέχουσα διαμόρφωση."

[crypto_aux]
    [crypto_aux.PemFileOpenFailure]
    other = "Αδυναμία ανοίγματος του αρχείου PEM <{{.PemPath}}> για τη διαμόρφωση του τοπικού δημόσιου κλειδιού SSH!"
    [crypto_aux.PemFileReadFailure]
    other = "Αδυναμία ανάγνωσης του δοθέντος αρχείου PEM!"
    [crypto_aux.PemFileDecodeFailure]
    other = "Αδυναμία σωστής αποκωδικοποίησης του αρχείου PEM!"
    [crypto_aux.PemFileUnsupportedTypeError]
    other = "Μη υποστηριζόμενο αρχείο PEM!"
    [crypto_aux.PemFileFormatError]
    other = "Μη υποστηριζόμενη μορφή πιστοποιητικού υπογραφής."
    [crypto_aux.InvalidLengthForEllipticCurveError]
    other = "Το παρεχόμενο μήκος δημόσιου κλειδιού <{{.PemLen}}> δεν είναι κατάλληλο για γνωστούς αλγορίθμους κρυπτογράφησης ελλειπτικής καμπύλης."
    [crypto_aux.InvalidLengthForRSAError]
    other = "Το παρεχόμενο μήκος δημόσιου κλειδιού <{{.PemLen}}> δεν είναι κατάλληλο για τον αλγόριθμο κρυπτογράφησης RSA."
    [crypto_aux.SSHPrivateKeyGenFailure]
    other = "Αδυναμία δημιουργίας ιδιωτικού κλειδιού SSH με βάση τον δοθέντα αλγόριθμο λόγω σφάλματος <{{.ErrInfo}}>."
    [crypto_aux.SSHPrivateKeySetFailure]
    other = "Αδυναμία ορισμού ιδιωτικού κλειδιού για την υπηρεσία SSH λόγω σφάλματος <{{.ErrInfo}}>."
    [crypto_aux.CreatePemToGivenPathError]
    other = "Αδυναμία δημιουργίας πιστοποιητικού στη δοθείσα διαδρομή <{{.PemPath}}>."
    [crypto_aux.Base64EncodeFailure]
    other = "Αδυναμία σωστής κωδικοποίησης του πιστοποιητικού σε συμβολοσειρά Base64."
    [crypto_aux.UnsupportedOrInvalidPemWarn]
    other = "Χρησιμοποιήθηκε μη έγκυρο ή μη υποστηριζόμενο πιστοποιητικό. Λεπτομέρειες: <{{.ErrInfo}}>. Το b0gus θα προσπαθήσει να δημιουργήσει ένα πιστοποιητικό σύμφωνα με τη διαμόρφωση."
    [crypto_aux.PemFileCreateFailure]
    other = "Αδυναμία δημιουργίας πιστοποιητικού στη διαδρομή <{{.PemPath}}> λόγω σφάλματος <{{.ErrInfo}}>, και η υπηρεσία b0gus δεν θα ξεκινήσει."

[databases]
    [databases.DatabaseTypeError]
    other = "Ανιχνεύθηκε μη υποστηριζόμενη βάση δεδομένων <{{.Database}}>!"

[configs]
    # Βάση δεδομένων
    [configs.InvalidDatabaseAddrError]
    other = "Παρέχεται μη έγκυρη διεύθυνση σύνδεσης βάσης δεδομένων <{{.DatabaseAddr}}> στο αρχείο ρυθμίσεων!"
    [configs.UnsupportDatabaseTypeError]
    other = "Ανιχνεύθηκε άγνωστος τύπος βάσης δεδομένων. Το τρέχον b0gus υποστηρίζει PostgreSQL, SQLite και MongoDB, ενώ επιλέξατε <{{.DatabaseType}}>."
    # Πληροφορίες καθολικής διαμόρφωσης
    [configs.ReadingConfigurationFailure]
    other = "Αδυναμία ανάγνωσης ρυθμίσεων. Αιτία αποτυχίας: <{{.ErrInfo}}>."
    [configs.ReloadingConfigurationFailure]
    other = "Αποτυχία επαναφόρτωσης του αρχείου ρυθμίσεων! Δεν θα αλλάξουν οι τρέχουσες ρυθμίσεις. Αιτία αποτυχίας: <{{.ErrInfo}}>."
    [configs.UnmarshallingConfigurationFailure]
    other = "Αδυναμία ανάλυσης του αρχείου ρυθμίσεων. Αιτία αποτυχίας: <{{.ErrInfo}}>."

[services]
	# abstract_tcpip
	[services.absTCPIPUninitErr]
	other = "Χρησιμοποιήθηκε μη αρχικοποιημένος ReentrantNetType"
