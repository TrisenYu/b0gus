    [services.SSHEstablishConnectionFailure]
    other = "Αδυναμία δημιουργίας σύνδεσης SSH. (Απομακρυσμένη διεύθυνση, τρέχουσα έκδοση SSH, αιτία αποτυχίας): (<{{.RemoteAddr}}>, <{{.CurrSSHver}}>, <{{.ErrInfo}}>)."
    [services.SSHchannelAcceptanceError]
    other = "Αδυναμία αποδοχής του τρέχοντος καναλιού SSH που παρέχεται στην απομακρυσμένη διεύθυνση <{{.RemoteAddr}}> λόγω σφάλματος <{{.ErrInfo}}>."
    [services.SSHinvalidConfigurationWarn]
    other = "Μη έγκυρη διαμόρφωση SSH, παράλειψη ενημέρωσης"
