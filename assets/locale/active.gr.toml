    [services.SSHSetupListenerError]
    other = "Αδυναμία ακρόασης του διακομιστή SSH στη δοθείσα διεύθυνση <{{.ListenAddr}}>."
    [services.SSHAcceptConnWarn]
    other = "Αδυναμία αποδοχής εξωτερικής αίτησης σύνδεσης SSH λόγω σφάλματος <{{.ErrInfo}}>."
    [services.SSHCanNotUseSigner]
