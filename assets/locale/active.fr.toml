[meta_conf]
    [meta_conf.AssetsDir]
    other = "Définir le répertoire des ressources statiques."
    [meta_conf.ConfPath]
    other = "Chemin du fichier de configuration local."
    [meta_conf.PermitConfAlterInRuntime]
    other = "Paramètre autorisant la modification de la configuration en cours d'exécution."
    [meta_conf.PermitSelfAlterInRuntime]
    other = "Paramètre autorisant la modification automatique de la configuration en cours d'exécution."
