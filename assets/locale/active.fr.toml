    other = "Impossible de générer une clé privée SSH avec l'algorithme donné en raison de l'erreur <{{.ErrInfo}}>."
    [crypto_aux.SSHPrivateKeySetFailure]
    other = "Impossible de définir la clé privée pour le service SSH en raison de l'erreur <{{.ErrInfo}}>."
    [crypto_aux.CreatePemToGivenPathError]
    other = "Impossible de créer le certificat dans le chemin donné <{{.PemPath}}>."
    [crypto_aux.Base64EncodeFailure]
    other = "Impossible d'encoder correctement le certificat en chaîne Base64."
    [crypto_aux.UnsupportedOrInvalidPemWarn]
    other = "Certificat invalide ou non pris en charge utilisé, détails : <{{.ErrInfo}}>. b0gus tentera de générer un certificat selon la configuration."
    [crypto_aux.PemFileCreateFailure]
    other = "Impossible de créer le certificat dans le chemin <{{.PemPath}}> en raison de l'erreur <{{.ErrInfo}}>, et le service b0gus ne démarrera pas."

[databases]
    [databases.DatabaseTypeError]
    other = "Base de données non prise en charge découverte <{{.Database}}> !"
    [databases.InvalidMongoDBclientErr]
    other = "Client MongoDB invalide !"

[configs]
    # Base de données
    [configs.InvalidDatabaseAddrError]
    other = "Adresse de connexion à la base de données invalide fournie dans le fichier de configuration <{{.DatabaseAddr}}> !"
    [configs.UnsupportDatabaseTypeError]
    other = "Type de base de données inconnu découvert. Actuellement, b0gus prend en charge PostgreSQL, SQLite et MongoDB, et vous avez choisi <{{.DatabaseType}}>."
    # Informations de configuration globale
    [configs.ReadingConfigurationFailure]
    other = "Impossible de lire la configuration. Raison de l'échec : <{{.ErrInfo}}>."
