    other = "Impossible de définir la clé privée pour le service SSH en raison de l'erreur <{{.ErrInfo}}>."
    [crypto_aux.CreatePemToGivenPathError]
    other = "Impossible de créer le certificat au chemin donné <{{.PemPath}}>."
    [crypto_aux.Base64EncodeFailure]
    other = "Impossible d'encoder correctement le certificat en chaîne Base64."
    [crypto_aux.UnsupportedOrInvalidPemWarn]
