[main]
    [main.DatabaseConnectionError]
    other = "Impossible de se connecter à la base de données {{.DatabaseStr}}. Erreur détectée : `{{.ErrInfo}}`."
    [main.DatabaseEmptyError]
    other = "Un opérateur de base de données vide a été obtenu avec la configuration donnée."
    [main.DatabaseChangingWarn]
    other = "En raison d'une erreur interne, la base de données actuellement utilisée ne sera pas remplacée."
