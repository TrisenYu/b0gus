    other = "Paramètre autorisant la modification de la configuration par télémétrie en cours d'exécution."

[main]
    [main.DatabaseConnectionError]
    other = "Impossible de se connecter à la base de données {{.DatabaseStr}}. Erreur détectée : <{{.ErrInfo}}>."
    [main.DatabaseEmptyError]
    other = "Opérateur de base de données vide obtenu avec la configuration donnée."
    [main.DatabaseChangingWarn]
    other = "Erreur interne, la base de données actuellement utilisée n'est pas changée."
    [main.TerminationSignalWarn]
    other = "Signal d'arrêt du serveur b0gus capturé <{{.SignalStr}}>."
    [main.FailToApplyConfiguration]
    other = "Impossible d'appliquer le fichier de configuration donné à la configuration actuelle."

[crypto_aux]
    [crypto_aux.PemFileOpenFailure]
    other = "Impossible d'ouvrir le fichier PEM <{{.PemPath}}> pour configurer la clé publique SSH locale !"
    [crypto_aux.PemFileReadFailure]
    other = "Impossible de lire le fichier PEM donné !"
    [crypto_aux.PemFileDecodeFailure]
    other = "Impossible de décoder correctement le fichier PEM !"
    [crypto_aux.PemFileUnsupportedTypeError]
    other = "Type de fichier PEM non pris en charge !"
    [crypto_aux.PemFileFormatError]
    other = "Format de certificat de signature non pris en charge."
    [crypto_aux.InvalidLengthForEllipticCurveError]
    other = "La longueur de la clé publique fournie <{{.PemLen}}> ne convient pas aux algorithmes de courbe elliptique connus."
    [crypto_aux.InvalidLengthForRSAError]
    other = "La longueur de la clé publique fournie <{{.PemLen}}> ne convient pas à l'algorithme RSA."
