    other = "Impossible de créer le certificat au chemin <{{.PemPath}}> en raison de l'erreur <{{.ErrInfo}}>, et le service b0gus ne démarrera pas."

[databases]
    [databases.DatabaseTypeError]
    other = "Base de données non prise en charge détectée <{{.Database}}> !"

[configs]
    # Base de données
    [configs.InvalidDatabaseAddrError]
    other = "Adresse de connexion à la base de données invalide <{{.DatabaseAddr}}> fournie dans le fichier de configuration !"
    [configs.UnsupportDatabaseTypeError]
    other = "Type de base de données inconnu détecté. b0gus prend actuellement en charge PostgreSQL, SQLite et MongoDB, et vous avez sélectionné <{{.DatabaseType}}>."
    # Informations de configuration globale
    [configs.ReadingConfigurationFailure]
    other = "Impossible de lire la configuration. Raison de l'échec : <{{.ErrInfo}}>."
