    other = "La longueur de clé publique fournie <{{.PemLen}}> n'est pas adaptée à l'algorithme RSA."
    [crypto_aux.SSHPrivateKeyGenFailure]
    other = "Impossible de générer une clé privée SSH avec l'algorithme donné en raison de l'erreur <{{.ErrInfo}}>."
